# yaml-language-server: $schema=https://raw.githubusercontent.com/brettinternet/noon/main/noon.schema.json
version: 1

jobs:
  review:
    description: Review, fix, and merge project PRs in Herdr
    schedule: every monday at 10am
    run:
      - /bin/bash
      - -ec
      - 'exec direnv exec ~ /bin/bash -ec "$1"'
      - --
      - |
        notify_env=()
        if [[ -n "${APPRISE_URLS:-}" ]]; then
          notify_env=(--env APPRISE_URLS)
        fi
        exec ~/.bin/agent reviewer \
          --pane-title "review-$(date +%s)" \
          --herdr-session default \
          --workspace maintenance --tab review \
          --cwd /Users/brett/dev/me/maintenance \
          "${notify_env[@]}" \
          --prompt \
          'Review all PRs created by this project. Fix any issues that need addressing,
        then merge changes that are good and safe to merge. Close PRs that are not
        worthwhile changes rather than merging them.

        Use Tell MCP only to escalate unresolved problems or blockers that require
        user attention or action and cannot be resolved safely within this run.
        Do not notify for job start, progress, discovered issues you can resolve,
        successful completion, or routine decisions to fix, merge, or close PRs.
        If escalation is needed, send one consolidated notification with relevant
        PR URLs, what remains blocked, and the specific user action needed.
        Otherwise, send no notifications.'
    timeout: 2m
    # Notify only if the launcher fails; successful dispatch is silent.
    on_failure: >-
      exec direnv exec ~ /bin/bash -ec '
      [ -n "${APPRISE_URLS:-}" ] || exit 0;
      exec tell notify --type failure --title maintenance
      "Pi review launcher failed. Check noon logs review."'
