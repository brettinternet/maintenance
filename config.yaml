---
version: 1

defaults:
  enabled: true
  model: auto
  commit_author:
    name: brett
    email: 20871604+brettinternet@users.noreply.github.com
  base_branch: null
  checks:
    - [git, diff, --check]
  draft_pr: false
  runs_on: ubuntu-latest

repositories:
  - owner: &repository_owner brettinternet
    name: maintenance
    checks:
      - [git, diff, --check]
      - [uv, sync, --frozen]
      - [uv, run, pytest]
      - [shellcheck, scripts/run-copilot.sh, scripts/validate-config.sh]
      - [actionlint, -config-file, .github/actionlint.yaml, .github/workflows/maintenance.yml]
  - owner: *repository_owner
    name: local
    checks:
      - [git, diff, --check]
      - [mise, exec, task, --, task, check]
  - owner: *repository_owner
    name: worklease
    checks:
      - [git, diff, --check]
      - [mise, run, test]
      - [mise, run, typecheck]
      - [mise, run, lint]
      - [mise, run, format-check]
  - owner: *repository_owner
    name: hum
    checks:
      - [git, diff, --check]
      - [mise, exec, task, --, task, ci]
  - owner: *repository_owner
    name: brettinternet.github.io
    instructions: |
      Prefer accessibility, semantic HTML, broken-link, metadata, or test-coverage improvements.
      Do not rewrite authored posts or change the site's visual design.
    checks:
      - [git, diff, --check]
      - [bun, install, --frozen-lockfile]
      - [bun, run, check]
  - owner: *repository_owner
    name: pi-extensions
    checks:
      - [git, diff, --check]
      - [bun, install, --frozen-lockfile]
      - [bun, run, check]
      - [bun, run, test]
  - owner: *repository_owner
    name: herdr-plugins
    checks:
      - [git, diff, --check]
      - [python, -m, unittest, discover, -s, tests]
      - [python, command-palette/test_workspace_overview.py]
      - [python, command-palette/test_workspace_picker.py]
      - [python, workbench/test_workbench.py]
      - [shellcheck, command-palette/open-workspace-overview.sh, command-palette/open-workspace-picker.sh, command-palette/open.sh, command-palette/palette.sh, previous-pane-focus/restore-previous.sh, previous-pane-focus/track-focus.sh, seamless-navigation/dispatch.sh, window-title/set-tab-title-from-pane.sh, window-title/sync-title.sh]
  - owner: *repository_owner
    name: panelctl
    runs_on: macos-15
    checks:
      - [git, diff, --check]
      - [swift, build, --disable-sandbox, --build-tests, -Xswiftc, -warnings-as-errors]
      - [swift, test, --disable-sandbox]
      - [scripts/test-release-version.sh]
  - owner: *repository_owner
    name: HyperWindow
    runs_on: macos-15
    checks:
      - [git, diff, --check]
      - [scripts/test-release-version.sh]
      - [mise, exec, task, --, task, test:unit]
  - owner: *repository_owner
    name: containers
    checks:
      - [git, diff, --check]
      - [mise, exec, task, --, task, check]
  - owner: *repository_owner
    name: project
    checks:
      - [git, diff, --check]
      - [mise, exec, task, --, task, server:setup-ci]
      - [mise, exec, task, --, task, client:setup-ci]
      - [mise, exec, task, --, task, ci]
  - owner: *repository_owner
    name: mic-mute
    runs_on: macos-15
    checks:
      - [git, diff, --check]
      - [mise, exec, cargo, --, cargo, clippy, --locked, --release, --, -D, warnings]
      - [mise, exec, cargo, --, cargo, fmt, --, --check]
      - [mise, exec, cargo, --, cargo, test, --locked]
  - owner: *repository_owner
    name: trmnl
    checks:
      - [git, diff, --check]
      - [mise, exec, task, --, task, check]
  - owner: *repository_owner
    name: slackbot
    checks:
      - [git, diff, --check]
      - [mise, exec, task, --, task, setup:gobin]
      - [mise, exec, task, --, task, check]
      - [mise, exec, task, --, task, test]
  - owner: *repository_owner
    name: slack-desk-bot
    checks:
      - [git, diff, --check]
      - [bun, install, --frozen-lockfile]
      - [mise, exec, task, --, task, check]
      - [mise, exec, task, --, task, test]
  - owner: *repository_owner
    name: homebrew-tap
    runs_on: macos-15
    instructions: |
      The brettinternet/hum release workflow automatically updates Formula/hum.rb.
      Do not manually bump Hum versions or checksums; look for another worthwhile maintenance task.
    checks:
      - [git, diff, --check]
      - [./.github/scripts/check-homebrew-tap.sh, brettinternet/tap, hum]
  - owner: *repository_owner
    name: homelab
    instructions: |
      Prefer maintenance to validation, documentation, and local tooling.
      Do not change deployed services, host configuration, or encrypted secret files.
    checks:
      - [git, diff, --check]
      - [mise, exec, task, --, task, check]
  - owner: *repository_owner
    name: stream-deck-hammerspoon
    checks:
      - [git, diff, --check]
      - [bun, install, --frozen-lockfile]
      - [bun, run, lint]
      - [bun, run, check]
      - [bun, run, test]
      - [bun, run, validate]
  - owner: *repository_owner
    name: slides
    instructions: |
      Prefer maintenance to shared layouts, scripts, tooling, and tests.
      Do not rewrite authored slide content or change the presentation design.
    checks:
      - [git, diff, --check]
      - [bun, install, --frozen-lockfile]
      - [mise, exec, task, --, task, check]
  - owner: *repository_owner
    name: scad
    instructions: |
      Preserve the rendered models' dimensions, fit, and geometry.
      Do not commit generated model files.
    checks:
      - [git, diff, --check]
      - [sudo, apt-get, update]
      - [sudo, apt-get, install, --yes, openscad]
      - [mise, exec, task, --, task, render]
