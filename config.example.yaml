# Copy the shape below into config.yaml and replace the example repositories.
# This file contains no credentials; keep MAINTENANCE_GITHUB_TOKEN in
# GitHub Actions secrets instead.
version: 1

defaults:
  enabled: true
  # "auto" avoids depending on account-specific model availability.
  model: auto
  commit_author:
    name: Maintenance Bot
    email: maintenance-bot@users.noreply.github.com
  # null means the repository's default branch. Set this to main/master/etc.
  base_branch: null
  # Optional instructions are appended to the fixed safety prompt. Repository
  # instructions override this default and cannot relax the safety boundaries.
  instructions: null
  # Checks are argv arrays, not shell command strings. Copilot sees them before
  # working, and they run from the target repository root afterward.
  checks:
    - [bun, test]
  draft_pr: true
  # The GitHub-hosted runner label used for this repository.
  runs_on: ubuntu-latest

repositories:
  - owner: octo-org
    name: ledger
    enabled: true
    model: auto
    commit_author:
      name: Ledger Maintenance Bot
      email: ledger-maintenance@users.noreply.github.com
    base_branch: main
    instructions: |
      Prefer improvements to type safety and test coverage.
      Do not change public API behavior.
    checks:
      - [bun, test]
      - [python, -m, pytest, -q]
    draft_pr: true
    runs_on: ubuntu-latest

  - owner: octo-org
    name: docs-site
    enabled: false
    # Omitted fields inherit defaults. Disabled repositories are excluded
    # from the Actions matrix.
